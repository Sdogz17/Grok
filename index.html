<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#191919" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        var query = window.matchMedia("(prefers-color-scheme: dark)");
        var meta = document.querySelector('meta[name="theme-color"]');
        function apply() {
          var dark = query.matches;
          var color = dark ? "#191919" : "#ffffff";
          if (meta) meta.setAttribute("content", color);
          var root = document.documentElement;
          root.style.colorScheme = dark ? "dark" : "light";
          root.style.backgroundColor = color;
          if (document.body) {
            document.body.style.colorScheme = dark ? "dark" : "light";
            document.body.style.backgroundColor = color;
          }
        }
        apply();
        if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", apply);
        if (query.addEventListener) query.addEventListener("change", apply);
        else query.addListener(apply);
      })();
    </script>
    <meta name="description" content="Mandarin words learned each day, in pinyin, against a goal of 10." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mandarin" />
    <title>Mandarin</title>
    <link rel="icon" href="%BASE_URL%favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
